app = "hirere-api"
primary_region = "sin"

[build]

[env]
  HIRERE_USE_EMBEDDINGS = "0"
  CORS_ORIGINS = "https://hirere.vercel.app,http://localhost:3456"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
